<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="골라밥">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FCE7A0">
  <title>골라밥 - 오늘 뭐 먹지?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23FCE7A0'/><text x='50' y='70' font-size='60' text-anchor='middle'>🍚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --yellow: #fce7a0;
  --ink: #1b1b1b;
  --muted: #6b7280;
  --sky: #4fc3f7;
  --chat: #bfe6fb;
  --chat-bar: #5aa9f0;
  --home: #fbbf5e;
  --out: #cda8ee;
  --line: #e5e7eb;
  --title-font: "Black Han Sans", sans-serif;
  --hand-font: "Gaegu", cursive;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
}

body {
  font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  color: var(--ink);
  background: var(--yellow);
  display: flex;
  justify-content: center;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: none;
  background: none;
  -webkit-tap-highlight-color: transparent;
}

a {
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

/* ===== 앱 레이아웃 ===== */
.app {
  width: 100%;
  max-width: 430px;
  min-height: 100%;
  background: #fff;
  padding: 12px 20px 24px;
  display: flex;
  flex-direction: column;
}

@media (min-width: 500px) {
  body {
    padding: 24px 0;
  }

  .app {
    min-height: auto;
    border-radius: 32px;
    box-shadow: 0 20px 50px rgba(120, 90, 0, 0.18);
  }
}

.topbar {
  height: 40px;
  display: flex;
  align-items: center;
}

.hamburger {
  width: 36px;
  height: 36px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  padding: 4px;
}

.hamburger span {
  display: block;
  height: 3px;
  border-radius: 2px;
  background: var(--ink);
}

.title {
  font-family: var(--title-font);
  font-weight: 400;
  font-size: clamp(26px, 8vw, 34px);
  line-height: 1.25;
  text-align: center;
  margin: 4px 0 12px;
  word-break: keep-all;
}

.title .name {
  font-size: 1.2em;
}

/* ===== 룰렛 ===== */
.wheel-area {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wheel-wrap {
  position: relative;
  width: 76vw;
  height: 76vw;
  max-width: 290px;
  max-height: 290px;
}

#wheel {
  width: 100%;
  height: 100%;
  cursor: pointer;
  transition: transform 4.8s cubic-bezier(0.15, 0.7, 0.12, 1);
}

.pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 28px;
  height: 34px;
  background: #5b4636;
  -webkit-clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
  clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%);
  z-index: 2;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
}

.hub {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: #333;
  pointer-events: none;
}

.link-btn {
  margin-top: 6px;
  font-size: 13px;
  color: var(--muted);
  padding: 4px 8px;
  border-radius: 8px;
}

.link-btn:hover {
  background: #f3f4f6;
}

/* ===== 컨트롤 ===== */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 10px 0 16px;
}

.counter {
  display: flex;
  align-items: center;
  gap: 8px;
}

.counter-label {
  font-size: 14px;
  color: var(--muted);
}

.counter strong {
  min-width: 36px;
  text-align: center;
}

.step-btn {
  width: 32px;
  height: 32px;
  border: 1.5px solid #d1d5db;
  border-radius: 6px;
  background: #f9fafb;
  font-size: 18px;
  font-weight: 700;
  color: #6b7280;
}

.step-btn:hover:not(:disabled) {
  background: #eef2f7;
}

.start-btn {
  font-family: var(--title-font);
  font-size: 24px;
  letter-spacing: 0.5px;
  color: #0b2545;
  background: var(--sky);
  padding: 6px 14px;
  border-radius: 6px;
  box-shadow: 0 3px 0 #2a9fd3;
  transition: transform 0.1s, box-shadow 0.1s;
}

.start-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: none;
}

/* ===== 하단 카드 ===== */
.cards {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  grid-template-rows: 130px 130px;
  gap: 14px;
}

.chat-card {
  grid-row: span 2;
  background: var(--chat);
  border-radius: 28px;
  padding: 12px 10px 10px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-log {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 2px 2px 8px;
  scrollbar-width: thin;
}

.msg {
  font-size: 13px;
  line-height: 1.5;
  padding: 8px 10px;
  border-radius: 14px;
  max-width: 92%;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.msg.greeting {
  margin: auto 0;
  max-width: 100%;
  background: none;
  text-align: center;
  font-weight: 700;
  font-size: 14px;
}

.msg.bot {
  align-self: flex-start;
  background: #fff;
  border-bottom-left-radius: 4px;
}

.msg.user {
  align-self: flex-end;
  background: var(--chat-bar);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg .menu-name {
  font-weight: 700;
  font-size: 15px;
}

.msg-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.msg-actions button,
.msg-actions a {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  background: #eef6fd;
  color: #1d4e89;
  text-decoration: none;
}

.typing span {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 1px;
  border-radius: 50%;
  background: #9ca3af;
  animation: blink 1s infinite;
}

.typing span:nth-child(2) {
  animation-delay: 0.15s;
}

.typing span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes blink {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.chat-input {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--chat-bar);
  border-radius: 999px;
  padding: 4px 6px 4px 10px;
}

.chat-input .bowl svg {
  display: block;
  width: 24px;
  height: 19px;
}

.chat-input input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 16px; /* 16px 미만이면 iOS가 입력 시 화면을 확대함 */
  padding: 4px 2px;
}

.chat-input input::placeholder {
  color: rgba(255, 255, 255, 0.85);
}

.mic {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #0b2545;
  flex-shrink: 0;
}

.mic.listening {
  background: #fff;
  color: #ef4444;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.12); }
}

.tile {
  border-radius: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 10px 6px 12px;
  transition: transform 0.15s;
}

.tile:hover {
  transform: translateY(-2px);
}

.tile:active {
  transform: scale(0.97);
}

.tile.home {
  background: var(--home);
}

.tile.out {
  background: var(--out);
}

.tile-label {
  font-family: var(--hand-font);
  font-size: 28px;
  line-height: 1;
}

.tile-icon svg {
  display: block;
  width: 72px;
  height: 62px;
}

/* ===== 드로어 ===== */
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 20;
}

.drawer.open {
  opacity: 1;
  pointer-events: auto;
}

.drawer-panel {
  width: min(78vw, 300px);
  height: 100%;
  background: #fff;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transform: translateX(-100%);
  transition: transform 0.25s;
}

.drawer.open .drawer-panel {
  transform: none;
}

.drawer-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 16px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.drawer-head strong {
  font-family: var(--title-font);
  font-weight: 400;
  font-size: 22px;
}

.drawer-head p {
  font-size: 12px;
  color: var(--muted);
}

.logo {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--yellow);
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo svg {
  width: 36px;
  height: 29px;
}

.drawer-panel > button {
  text-align: left;
  padding: 12px;
  border-radius: 10px;
  font-size: 15px;
}

.drawer-panel > button:hover {
  background: #f3f4f6;
}

.drawer-panel > button.danger {
  margin-top: auto;
  color: #dc2626;
}

/* ===== 바텀 시트 ===== */
.sheet-backdrop {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 30;
}

.sheet-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  position: relative;
  width: 100%;
  max-width: 430px;
  max-height: 85vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px));
  -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.sheet-backdrop.open .sheet {
  transform: none;
}

.sheet-close {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 22px;
  color: var(--muted);
}

.sheet-close:hover {
  background: #f3f4f6;
}

.sheet h2 {
  font-family: var(--title-font);
  font-weight: 400;
  font-size: 26px;
  margin-bottom: 4px;
}

.sheet h3 {
  font-size: 15px;
  margin: 20px 0 8px;
}

.sheet-desc {
  font-size: 14px;
  color: var(--muted);
}

.note {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 999px;
  background: #fff4d6;
  border: 1.5px solid #f5d27a;
  font-size: 14px;
}

.chip button {
  font-size: 15px;
  line-height: 1;
  color: #a16207;
}

button.chip.ghost {
  background: #fff;
  border: 1.5px dashed #d1d5db;
  color: var(--muted);
  font-size: 13px;
  padding: 4px 10px;
}

button.chip.selected {
  background: var(--out);
  border-color: #a77fd6;
  color: var(--ink);
}

.add-row {
  display: flex;
  gap: 6px;
  margin: 10px 0;
}

.add-row input,
.text-input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 16px;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  outline: none;
}

.add-row input:focus,
.text-input:focus {
  border-color: var(--sky);
}

.btn {
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 15px;
  background: #f3f4f6;
  text-align: center;
  text-decoration: none;
  display: inline-block;
}

.btn.primary {
  background: var(--sky);
  color: #0b2545;
}

.btn.home {
  background: var(--home);
}

.btn.out {
  background: var(--out);
}

.btn-row {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.btn-row > * {
  flex: 1;
}

.recipe-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.recipe-card {
  text-align: left;
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  transition: border-color 0.15s;
}

.recipe-card:hover {
  border-color: var(--home);
}

.recipe-card .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
}

.badge {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #dcfce7;
  color: #15803d;
}

.badge.partial {
  background: #fef3c7;
  color: #b45309;
}

.recipe-card p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.ingredients {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  list-style: none;
}

.ingredients li {
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #dcfce7;
}

.ingredients li.missing {
  background: #fee2e2;
}

.steps {
  padding-left: 20px;
  line-height: 1.7;
  font-size: 15px;
}

.steps li + li {
  margin-top: 6px;
}

.result {
  text-align: center;
  padding: 12px 0 4px;
}

.result-label {
  color: var(--muted);
}

.result-menu {
  font-family: var(--title-font);
  font-size: 40px;
  margin: 8px 0;
  animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
}

@keyframes pop {
  from { transform: scale(0.4); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.option-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}

.option-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.option-row .dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(0, 0, 0, 0.15);
}

.option-row button {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 18px;
  color: var(--muted);
}

.option-row button:hover:not(:disabled) {
  background: #fee2e2;
  color: #dc2626;
}

.history-list {
  list-style: none;
  margin-top: 12px;
}

.history-list li {
  display: flex;
  justify-content: space-between;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}

.history-list small {
  color: var(--muted);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 24px 0;
  font-size: 14px;
}

/* ===== 토스트 ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  background: rgba(17, 24, 39, 0.9);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 40;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 360px) {
  .cards {
    grid-template-rows: 115px 115px;
  }

  .tile-icon svg {
    width: 60px;
    height: 52px;
  }

  .start-btn {
    font-size: 20px;
  }
}
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="hamburger" id="menu-btn" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </header>

    <h1 class="title">
      무엇을 먹을지 고민인<br>
      <span class="name" id="title-name">이은우님</span>을 위한
    </h1>

    <!-- 룰렛 -->
    <section class="wheel-area">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600" aria-label="메뉴 룰렛"></canvas>
        <div class="hub"></div>
      </div>
      <button class="link-btn" id="edit-options">✏️ 옵션 편집</button>
    </section>

    <div class="controls">
      <div class="counter">
        <span class="counter-label">옵션 개수</span>
        <button class="step-btn" id="minus" aria-label="옵션 줄이기">−</button>
        <strong id="count">8개</strong>
        <button class="step-btn" id="plus" aria-label="옵션 늘리기">+</button>
      </div>
      <button class="start-btn" id="start">START!</button>
    </div>

    <!-- 하단 카드 -->
    <section class="cards">
      <div class="chat-card">
        <div class="chat-log" id="chat-log"></div>
        <form class="chat-input" id="chat-form" autocomplete="off">
          <span class="bowl" aria-hidden="true">
            <svg viewBox="0 0 40 32"><path d="M7 15 Q7 5 20 5 Q33 5 33 15 Z" fill="#fff"/><path d="M3 14 H37 Q36 25 26 28 H14 Q4 25 3 14 Z" fill="#2F6FD6"/><rect x="13" y="27" width="14" height="3" rx="1.5" fill="#1E4FA3"/></svg>
          </span>
          <input type="text" id="chat-input" placeholder="골라밥에게 물어보기" maxlength="100">
          <button type="button" class="mic" id="mic" aria-label="음성으로 말하기">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
          </button>
        </form>
      </div>

      <button class="tile home" id="home-btn">
        <span class="tile-label">집밥</span>
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 64 58">
            <rect x="4" y="51" width="56" height="6" rx="3" fill="#7CC36A"/>
            <path d="M12 27 L32 11 L52 27 V52 H12 Z" fill="#FBE8CF"/>
            <path d="M6 29 L32 8 L58 29" fill="none" stroke="#E4573D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="32" cy="23" r="3.5" fill="#8EC5F0" stroke="#4A7DB0" stroke-width="1.2"/>
            <rect x="17" y="34" width="10" height="18" fill="#F28C38"/>
            <rect x="33" y="34" width="14" height="10" fill="#8EC5F0" stroke="#4A7DB0" stroke-width="1.5"/>
            <line x1="40" y1="34" x2="40" y2="44" stroke="#4A7DB0" stroke-width="1.5"/>
          </svg>
        </span>
      </button>
      <button class="tile out" id="out-btn">
        <span class="tile-label">외식</span>
        <span class="tile-icon" aria-hidden="true">

function esc(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
  return t + "…";
}

function drawWheel() {

  wctx.clearRect(0, 0, size, size);

  for (let i = 0; i < n; i++) {
    const start = -Math.PI / 2 + i * seg;
    wctx.beginPath();
    wctx.moveTo(c, c);
    wctx.arc(c, c, r, start, start + seg);
    wctx.closePath();
    wctx.fillStyle = wheelColor(i, n);
    wctx.fill();
    wctx.strokeStyle = "rgba(0,0,0,0.08)";
    wctx.lineWidth = 2;
    wctx.stroke();
  }

  wctx.beginPath();
  wctx.arc(c, c, r, 0, Math.PI * 2);
  wctx.lineWidth = 10;
  wctx.strokeStyle = "#6b6258";
  wctx.stroke();

  const fontSize = n <= 6 ? 28 : n <= 8 ? 25 : n <= 10 ? 22 : 19;
  const labelRadius = r * (n <= 4 ? 0.55 : n <= 8 ? 0.64 : 0.7);
  const maxLabelWidth = n <= 4 ? 200 : n <= 8 ? 110 : 80;
  wctx.font = `700 ${fontSize}px "Noto Sans KR", sans-serif`;
  wctx.textAlign = "center";
  wctx.textBaseline = "middle";

  for (let i = 0; i < n; i++) {
    const mid = -Math.PI / 2 + (i + 0.5) * seg;
    const x = c + Math.cos(mid) * labelRadius;
    const y = c + Math.sin(mid) * labelRadius;
    const text = fitText(wctx, optionLabel(i), maxLabelWidth);
    const w = wctx.measureText(text).width + 16;
    const h = fontSize + 12;

    roundRectPath(wctx, x - w / 2, y - h / 2, w, h, 6);
    wctx.fillStyle = "#fff";
    wctx.fill();
    wctx.lineWidth = 2;
    wctx.strokeStyle = "#444";
    wctx.stroke();

    wctx.fillStyle = "#1b1b1b";
    wctx.fillText(text, x, y + 1);
  }
}

function renderOptions() {
  $("count").textContent = `${options.length}개`;
  $("minus").disabled = spinning || options.length <= MIN_OPTIONS;
  $("plus").disabled = spinning || options.length >= MAX_OPTIONS;
  drawWheel();
}

function saveOptions() {
  store.set("options", options);
  renderOptions();
}

function addOption(name) {
  if (options.length >= MAX_OPTIONS) return false;
  if (!name) {
    const unused = MENUS.map((m) => m.name).filter((m) => !options.includes(m));
    name = unused.length ? pickRandom(unused) : `옵션 ${options.length + 1}`;
  }
  options.push(name);
  saveOptions();
  return true;
}

function spin() {
  if (spinning) return;
  spinning = true;
  startBtn.disabled = true;
  renderOptions();

  const n = options.length;
  const seg = 360 / n;
  const idx = Math.floor(Math.random() * n);
  const target = idx * seg + seg * (0.15 + Math.random() * 0.7);
  const desired = (360 - target) % 360;
  const current = ((rotation % 360) + 360) % 360;
  rotation += 360 * 6 + ((desired - current + 360) % 360);
  pendingWinner = optionLabel(idx);
  wheel.style.transform = `rotate(${rotation}deg)`;
}

wheel.addEventListener("transitionend", () => {
  if (!spinning) return;
  spinning = false;
  startBtn.disabled = false;
  renderOptions();
  addHistory(pendingWinner, "룰렛");
  openSheet(() => renderResult(pendingWinner));
});

wheel.addEventListener("click", () => {
  if (!spinning) openSheet(renderOptionsEditor);
});

$("plus").addEventListener("click", () => addOption());
$("minus").addEventListener("click", () => {

function hasIngredient(ing) {
  return fridge.some((f) => f === ing || f.includes(ing));
}

function saveFridge() {
  store.set("fridge", fridge);
}

function addToFridge(raw) {
  const items = raw.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean);
  for (const item of items) {
    if (!fridge.includes(item)) fridge.push(item);
  }
  saveFridge();
}

function recommendRecipes() {
  return RECIPES.map((r) => {
    const have = r.ingredients.filter(hasIngredient);
    const missing = r.ingredients.filter((i) => !hasIngredient(i));
    return { recipe: r, have, missing };
  })
    .filter((x) => x.have.length > 0)
    .sort((a, b) => a.missing.length - b.missing.length || b.have.length - a.have.length)
    .slice(0, 6);
}

const chatLog = $("chat-log");
const chatForm = $("chat-form");
const chatInput = $("chat-input");
let greetingEl = null;
let lastTags = [];
let lastMenu = null;

function scrollChat() {
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addUserMessage(text) {
  if (greetingEl) {
    greetingEl.classList.remove("greeting");
    greetingEl.classList.add("bot");
  }
  const el = document.createElement("div");

function addBotMessage(html, menu) {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = html;
  if (menu) {
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    actions.innerHTML = `
      ${recipeActionHtml(menu, "", "🏡 레시피")}
      <a href="${naverMapUrl(menu)}" target="_blank" rel="noopener">🚙 맛집</a>
      <button data-chat="wheel">🎡 룰렛에 추가</button>`;
    const recipeBtn = actions.querySelector("[data-act='recipe']");
    if (recipeBtn) recipeBtn.addEventListener("click", () => openRecipe(menu));
    actions.querySelector("[data-chat='wheel']").addEventListener("click", () => {
      if (options.includes(menu)) toast("이미 룰렛에 있어요!");
      else if (addOption(menu)) toast(`룰렛에 ${menu} 추가!`);
      else toast(`룰렛이 가득 찼어요 (최대 ${MAX_OPTIONS}개)`);
    });
    el.append(actions);
  }
  chatLog.append(el);
  scrollChat();
}

function isNegated(text, index, length) {
  const before = text.slice(Math.max(0, index - 3), index);
  const after = text.slice(index + length, index + length + 10);
  return /안\s?$/.test(before) || /^[^,.!?]{0,5}(말고|빼고|싫|제외|없는|별로)/.test(after);
}

function recommend(text) {
  const want = [];
  const avoid = [];
  for (const rule of TAG_RULES) {
    const m = text.match(rule.re);
    if (m) (isNegated(text, m.index, m[0].length) ? avoid : want).push(rule.tag);
  }

  // 메뉴 이름을 직접 말한 경우
  const direct = MENUS.find((m) => text.includes(m.name));
  if (direct) {
    const idx = text.indexOf(direct.name);
    if (!isNegated(text, idx, direct.name.length)) {
      lastMenu = direct.name;
      lastTags = direct.tags;
      return { menu: direct, reason: `${direct.name} 좋죠! 탁월한 선택이에요 👍` };
    }
    avoid.push(...direct.tags.slice(0, 1));
  }

  let tags = want;
  if (!want.length && /다른|또|별로|싫|말고/.test(text)) tags = lastTags;

  const candidates = MENUS.filter((m) => m.name !== lastMenu && !m.tags.some((t) => avoid.includes(t)));
  const scored = (candidates.length ? candidates : MENUS).map((m) => ({
    m,
    score: tags.filter((t) => m.tags.includes(t)).length,
  }));
  const best = Math.max(...scored.map((x) => x.score));
  const menu = pickRandom(scored.filter((x) => x.score === best)).m;

  let reason;
  if (tags.length && best > 0) {
    reason = `${tags.map((t) => "#" + t).join(" ")} 메뉴를 찾으시는군요!`;
  } else if (avoid.length) {
    reason = `${avoid.map((t) => "#" + t).join(" ")} 빼고 골라봤어요.`;
  } else if (tags.length) {
    reason = "딱 맞는 메뉴는 없지만, 이건 어때요?";
  } else {
    reason = pickRandom(["고민될 땐 골라밥이 골라드릴게요!", "오늘 같은 날엔 이게 딱이에요.", "골라밥의 추천 메뉴는요~"]);
  }

  lastTags = tags;
  lastMenu = menu.name;
  return { menu, reason };
}

function handleChat(text) {
  addUserMessage(text);

  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  chatLog.append(typing);
  scrollChat();

  setTimeout(() => {
    typing.remove();
    const { menu, reason } = recommend(text);
    addBotMessage(`${esc(reason)}<br><span class="menu-name">${menu.emoji} ${esc(menu.name)}</span> 어떠세요?`, menu.name);
  }, 600);
}

  chatInput.value = "";
  handleChat(text);

// 음성 입력
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $("mic");
let recognition = null;

micBtn.addEventListener("click", () => {
  if (!SpeechRecognition) {
    toast("이 브라우저는 음성 인식을 지원하지 않아요 (Chrome 권장)");
    return;
  }
  if (recognition) {
    recognition.stop();
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "ko-KR";
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript.trim();
    if (text) handleChat(text);
  };
  recognition.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      toast("마이크 권한이 없어요. 글자로 입력해주세요");
    } else {
      toast("음성을 인식하지 못했어요. 다시 시도해주세요");
    }
  };
  recognition.onend = () => {
    micBtn.classList.remove("listening");
    recognition = null;
  };
  try {
    micBtn.classList.add("listening");
    recognition.start();
  } catch {
    micBtn.classList.remove("listening");
    recognition = null;
    toast("이 환경에서는 음성 입력을 쓸 수 없어요");
  }
});

function renderHistory() {
  const fmt = (t) => {
    const d = new Date(t);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  sheetBody.innerHTML = `
    <h2>🕘 최근 결정한 메뉴</h2>
    ${
      menuHistory.length
        ? `<ul class="history-list">${menuHistory
            .map((h) => `<li><span>${menuEmoji(h.menu)} ${esc(h.menu)} <small>· ${esc(h.source)}</small></span><small>${fmt(h.time)}</small></li>`)
            .join("")}</ul>
           <div class="btn-row"><button class="btn" id="history-clear">기록 지우기</button></div>`
        : `<p class="empty">아직 기록이 없어요. 룰렛을 돌려보세요! 🎡</p>`
    }`;
  const clearBtn = $("history-clear");
  if (clearBtn) {
    clearBtn.addEventListener("click", () => {
      menuHistory = [];
      store.set("history", menuHistory);
      renderHistory();
    });
  }
}

drawer.querySelectorAll("[data-nav]").forEach((btn) =>
  btn.addEventListener("click", () => {
    const nav = btn.dataset.nav;
    if (nav === "name") openSheet(renderNameEditor);
    else if (nav === "options") openSheet(renderOptionsEditor);
    else if (nav === "fridge") openSheet(renderHome);
    else if (nav === "out") openSheet(() => renderOut());
    else if (nav === "history") openSheet(renderHistory);
    else if (nav === "reset") openSheet(renderResetConfirm);
  })
);

// confirm()은 일부 브라우저·앱 내 브라우저에서 동작하지 않아 화면 안에서 확인
function renderResetConfirm() {
  sheetBody.innerHTML = `
    <h2>↺ 전체 초기화</h2>
    <p class="sheet-desc">이름, 룰렛 옵션, 냉장고, 기록이 모두 처음 상태로 돌아가요.</p>
    <div class="btn-row">
      <button class="btn" id="reset-cancel">취소</button>
      <button class="btn primary" id="reset-ok">초기화</button>
    </div>`;
  $("reset-cancel").addEventListener("click", closeSheet);
  $("reset-ok").addEventListener("click", () => {
    store.clear();
    userName = "이은우";
    options = DEFAULT_OPTIONS.slice();
    fridge = ["계란", "김치", "밥", "대파", "양파"];
    menuHistory = [];
    renderName();
    renderOptions();
    closeSheet();
    toast("초기화했어요");
  });
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeSheet();
    closeDrawer();
  }
});

// ================= 시작 =================
greetingEl = document.createElement("div");
greetingEl.className = "msg greeting";
chatLog.append(greetingEl);

renderName();
renderOptions();
if (document.fonts) document.fonts.ready.then(drawWheel);
</script>
</body>
</html>
